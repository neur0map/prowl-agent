name: CI

on:
  push:
    branches: [main, unstable]
  pull_request:
    branches: [main, unstable]

# Never leave a stale CI run burning once new commits land on the same ref.
concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-go@v5
        with:
          go-version-file: go.mod
          cache: true

      # gofmt is the cheapest gate, so it runs first and fails fast.
      - name: gofmt
        run: |
          unformatted=$(gofmt -l .)
          if [ -n "$unformatted" ]; then
            echo "These files are not gofmt-clean:"
            echo "$unformatted"
            exit 1
          fi

      # The SQLite driver needs cgo and the sqlite_fts5 build tag; a plain
      # go build/test is not a valid check for this project.
      - name: vet
        run: CGO_ENABLED=1 go vet -tags sqlite_fts5 ./...

      - name: build
        run: CGO_ENABLED=1 go build -tags sqlite_fts5 ./...

      - name: test
        run: CGO_ENABLED=1 go test -tags sqlite_fts5 ./...
