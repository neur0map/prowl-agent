name: build-binary

on:
  push:
    branches: [main]
    tags: ['v*']
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-go@v5
        with:
          go-version-file: go.mod
          cache: true

      - name: Build (cgo + fts5)
        env:
          CGO_ENABLED: "1"
        run: |
          if [ "${GITHUB_REF_TYPE}" = "tag" ]; then
            ver="${GITHUB_REF_NAME}"
          else
            ver="$(git describe --tags --always --dirty 2>/dev/null || echo dev)-${GITHUB_SHA::7}"
          fi
          go build -tags sqlite_fts5 -trimpath \
            -ldflags "-s -w -X main.version=${ver}" \
            -o prowl-agent-linux-amd64 ./cmd/prowl-agent
          ./prowl-agent-linux-amd64 --version

      - name: Test
        env:
          CGO_ENABLED: "1"
        run: go test -tags sqlite_fts5 ./...

      - name: Checksum
        run: sha256sum prowl-agent-linux-amd64 > prowl-agent-linux-amd64.sha256

      - name: Publish rolling release
        if: github.ref == 'refs/heads/main'
        uses: softprops/action-gh-release@v2
        with:
          tag_name: nightly
          name: Nightly (latest main)
          prerelease: true
          files: |
            prowl-agent-linux-amd64
            prowl-agent-linux-amd64.sha256
          body: >
            Rolling Linux x86_64 build of prowl-agent from the latest `main`
            (commit ${{ github.sha }}). Built with cgo; needs a recent glibc.
            Verify with the included `.sha256`.

      - name: Publish versioned release
        if: github.ref_type == 'tag'
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ github.ref_name }}
          name: ${{ github.ref_name }}
          prerelease: false
          files: |
            prowl-agent-linux-amd64
            prowl-agent-linux-amd64.sha256
          body: >
            Linux x86_64 build of prowl-agent ${{ github.ref_name }}. Built with
            cgo; needs a recent glibc. Verify with the included `.sha256`, or
            install the latest with the one-line installer in the README.
