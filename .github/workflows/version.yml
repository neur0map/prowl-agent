name: Version bump

# Every commit on unstable advances the patch. Patch is single-digit: the tenth
# bump rolls into the minor (0.8.9 -> 0.9.0) and resets patch to 0. Major stays
# manual. The bump commit carries [skip ci] so it never triggers itself.
on:
  push:
    branches: [unstable]

concurrency:
  group: version-${{ github.ref }}
  cancel-in-progress: false

permissions:
  contents: write

jobs:
  bump:
    if: ${{ !contains(github.event.head_commit.message, '[skip ci]') }}
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: unstable
          fetch-depth: 0

      - name: Compute and write next version
        id: bump
        run: |
          file=cmd/prowl-agent/main.go
          current=$(grep -oP 'var version = "v\K[0-9]+\.[0-9]+\.[0-9]+' "$file")
          if [ -z "$current" ]; then
            echo "could not read current version from $file" >&2
            exit 1
          fi
          major=${current%%.*}
          rest=${current#*.}
          minor=${rest%%.*}
          patch=${rest##*.}
          patch=$((patch + 1))
          if [ "$patch" -ge 10 ]; then
            minor=$((minor + 1))
            patch=0
          fi
          new="${major}.${minor}.${patch}"
          sed -i "s/var version = \"v[0-9]\+\.[0-9]\+\.[0-9]\+\"/var version = \"v${new}\"/" "$file"
          echo "new=${new}" >> "$GITHUB_OUTPUT"
          echo "bumped ${current} -> ${new}"

      - name: Commit and push
        run: |
          if git diff --quiet; then
            echo "version already current, nothing to bump"
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add cmd/prowl-agent/main.go
          git commit -m "chore: bump version to v${{ steps.bump.outputs.new }} [skip ci]"
          git push origin HEAD:unstable

      # Optionally cut a release for the new version. A tag pushed with the
      # default GITHUB_TOKEN cannot trigger the release workflow (GitHub blocks
      # that recursion), so this runs only when a RELEASE_PAT secret is present.
      # Without it, releases are cut by pushing a v* tag by hand, which builds
      # and publishes through release.yml.
      - name: Tag release
        env:
          GH_TOKEN: ${{ secrets.RELEASE_PAT }}
        run: |
          if [ -z "$GH_TOKEN" ]; then
            echo "no RELEASE_PAT secret; skipping auto-tag (push a v* tag by hand to cut a release)"
            exit 0
          fi
          tag="v${{ steps.bump.outputs.new }}"
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git tag -a "$tag" -m "prowl-agent $tag"
          git push "https://x-access-token:${GH_TOKEN}@github.com/${GITHUB_REPOSITORY}" "$tag"
